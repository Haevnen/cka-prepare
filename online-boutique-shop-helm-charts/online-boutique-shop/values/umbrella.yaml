emailservice:
  appName: emailservice
  appImage: gcr.io/google-samples/microservices-demo/emailservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 8080
  containerEnvVars:
    - name: PORT
      value: "8080"
    - name: DISABLE_PROFILER
      value: "1"
  servicePort: 8080
  serviceTargetPort: 8080
  serviceType: ClusterIP

paymentservice:
  appName: paymentservice
  appImage: gcr.io/google-samples/microservices-demo/paymentservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 50051
  containerEnvVars:
    - name: DISABLE_PROFILER
      value: "1"
    - name: PORT
      value: "50051"
  servicePort: 50051
  serviceTargetPort: 50051
  serviceType: ClusterIP

shippingservice:
  appName: shippingservice
  appImage: gcr.io/google-samples/microservices-demo/shippingservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 50051
  containerEnvVars:
    - name: PORT
      value: "50051"
    - name: DISABLE_PROFILER
      value: "1"
  servicePort: 50051
  serviceTargetPort: 50051
  serviceType: ClusterIP

adservice:
  appName: adservice
  appImage: gcr.io/google-samples/microservices-demo/adservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 50051
  containerEnvVars:
    - name: PORT
      value: "9555"
  servicePort: 9555
  serviceTargetPort: 9555
  serviceType: ClusterIP

currencyservice:
  appName: currencyservice
  appImage: gcr.io/google-samples/microservices-demo/currencyservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 7000
  containerEnvVars:
    - name: PORT
      value: "7000"
    - name: DISABLE_PROFILER
      value: "1"
  servicePort: 7000
  serviceTargetPort: 7000
  serviceType: ClusterIP

productcatalogservice:
  appName: productcatalogservice
  appImage: gcr.io/google-samples/microservices-demo/productcatalogservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 3550
  containerEnvVars:
    - name: PORT
      value: "3550"
    - name: DISABLE_PROFILER
      value: "1"
  servicePort: 3550
  serviceTargetPort: 3550
  serviceType: ClusterIP

recommendationservice:
  appName: recommendationservice
  appImage: gcr.io/google-samples/microservices-demo/recommendationservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 8080
  containerEnvVars:
    - name: PORT
      value: "8080"
    - name: PRODUCT_CATALOG_SERVICE_ADDR
      value: "productcatalogservice:3550"
    - name: DISABLE_PROFILER
      value: "1"
  servicePort: 8080
  serviceTargetPort: 8080
  serviceType: ClusterIP

cartservice:
  appName: cartservice
  appImage: gcr.io/google-samples/microservices-demo/cartservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 7070
  containerEnvVars:
    - name: REDIS_ADDR
      value: "redis-cart:6379"
  servicePort: 7070
  serviceTargetPort: 7070
  serviceType: ClusterIP

checkoutservice:
  appName: checkoutservice
  appImage: gcr.io/google-samples/microservices-demo/checkoutservice
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 5050
  containerEnvVars:
    - name: PORT
      value: "5050"
    - name: SHIPPING_SERVICE_ADDR
      value: "shippingservice:50051"
    - name: PRODUCT_CATALOG_SERVICE_ADDR
      value: "productcatalogservice:3550"
    - name: CART_SERVICE_ADDR
      value: "cartservice:7070"
    - name: CURRENCY_SERVICE_ADDR
      value: "currencyservice:7000"
    - name: EMAIL_SERVICE_ADDR
      value: "emailservice:8080"
    - name: PAYMENT_SERVICE_ADDR
      value: "paymentservice:50051"
  servicePort: 5050
  serviceTargetPort: 5050
  serviceType: ClusterIP

frontend:
  appName: frontend
  appImage: gcr.io/google-samples/microservices-demo/frontend
  appVersion: v0.8.0
  appReplicas: 1
  containerPort: 8080
  containerEnvVars:
    - name: PORT
      value: "8080"
    - name: SHIPPING_SERVICE_ADDR
      value: "shippingservice:50051"
    - name: PRODUCT_CATALOG_SERVICE_ADDR
      value: "productcatalogservice:3550"
    - name: CART_SERVICE_ADDR
      value: "cartservice:7070"
    - name: CURRENCY_SERVICE_ADDR
      value: "currencyservice:7000"
    - name: CHECKOUT_SERVICE_ADDR
      value: "checkoutservice:5050"
    - name: RECOMMENDATION_SERVICE_ADDR
      value: "recommendationservice:8080"
    - name: AD_SERVICE_ADDR
      value: "adservice:9555"
    - name: SHOPPING_ASSISTANT_SERVICE_ADDR
      value: "adservice:9555"
  servicePort: 8080
  serviceTargetPort: 8080
  serviceType: NodePort
  serviceNodePort: 32000

redis-cart:
  nameOverride: redis-cart
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 6379
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  storage:
    emptyDir: {}