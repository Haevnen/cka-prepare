apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
spec:
  type: {{ .Values.serviceType }}
  selector:
    app: {{ .Values.appName }}
  ports:
  - protocol: TCP
    targetPort: {{ .Values.serviceTargetPort | default .Values.containerPort }}
    port: {{ .Values.servicePort }}
{{ if .Values.serviceNodePort }}
    nodePort: {{ .Values.serviceNodePort }}
{{ end }}